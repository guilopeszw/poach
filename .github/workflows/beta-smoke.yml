name: Test downloaded beta on macOS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Private release tag to test
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Install release assets without a source checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          required_assets=(Poach-arm64.zip Poach-Codex.zip Poach.mcpb ffmpeg-8.1.3.tar.xz bundle-runtime.sh)
          if unzip -Z1 Poach-arm64.zip | grep -Fx 'Poach.app/Contents/Resources/runtime/bin/bun' >/dev/null; then
            required_assets+=(Bun-relink-materials.tar)
          fi
          for asset in "${required_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Release $RELEASE_TAG is missing $asset" >&2
              exit 1
            fi
          done
          if [ -f SHA256SUMS.txt ]; then
            expected_assets="$(printf '%s\n' "${required_assets[@]}" | LC_ALL=C sort)"
            manifest_assets="$(awk 'NF >= 2 {name = $2; sub(/^\*/, "", name); print name}' SHA256SUMS.txt | LC_ALL=C sort)"
            if [ "$manifest_assets" != "$expected_assets" ]; then
              echo "SHA256SUMS.txt must list exactly the required release assets" >&2
              exit 1
            fi
            shasum -a 256 -c SHA256SUMS.txt
          elif [[ ! "$RELEASE_TAG" =~ ^v0\.1\.0-beta\.[1-4]$ ]]; then
            echo "Release $RELEASE_TAG must include SHA256SUMS.txt" >&2
            exit 1
          else
            echo "Legacy beta has no checksum manifest; skipping digest verification."
          fi
          mkdir -p "$HOME/Applications" claude
          ditto -x -k Poach-arm64.zip "$HOME/Applications"
          ditto -x -k Poach-Codex.zip .
          unzip -q Poach.mcpb -d claude
      - name: Verify packaged versions against the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            expected_version="${BASH_REMATCH[1]}"
            check_version() {
              local file="$1" key="$2" actual_version
              actual_version="$(plutil -extract "$key" raw "$file")"
              if [[ "$actual_version" != "$expected_version" ]]; then
                echo "$file reports $actual_version, expected $expected_version for $RELEASE_TAG" >&2
                return 1
              fi
            }
            check_version "$HOME/Applications/Poach.app/Contents/Info.plist" CFBundleShortVersionString
            check_version "Poach Codex/marketplace/plugins/poach/.codex-plugin/plugin.json" version
            check_version claude/manifest.json version
          fi
      - name: Open the app and exercise both connector launchers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          export PATH=/usr/bin:/bin
          app="$HOME/Applications/Poach.app"
          codesign --verify --deep --strict "$app"
          open "$app"
          sleep 2
          pgrep -x Poach
          resources="$app/Contents/Resources"
          export PATH="$resources/runtime/bin:$PATH"
          ffmpeg -v error -loop 1 -i "$resources/Pouch.png" -t 1 -vf scale=96:96 -c:v mpeg4 -pix_fmt yuv420p "$RUNNER_TEMP/sample.mp4"
          export PATH=/usr/bin:/bin
          "$resources/runtime/bin/node" --input-type=module - "$HOME/Library/Caches/Poach/active-brief.json" "$RUNNER_TEMP/sample.mp4" "$resources/Pouch.png" <<'JS'
          import {mkdir, writeFile} from 'node:fs/promises';
          import {dirname} from 'node:path';
          const [briefPath, videoPath, imagePath] = process.argv.slice(2);
          const brief = {
            version: 1,
            briefId: 'df5ff2b4-663c-41ec-8de2-5c90e837bd82',
            sharedAt: Date.now() / 1000,
            context: '[0.50s] The card moves into Done after a drag.',
            instruction: 'Recreate this interaction.',
            evidence: {
              mediaType: 'video',
              sourcePath: videoPath,
              keyframes: [{imagePath, kind: 'start', timeMs: 0}],
              annotations: [{timeMs: 500, text: 'The card lands in Done.'}],
              pointerTrace: {
                available: true,
                coordinateSpace: 'normalized-capture-bounds',
                origin: 'top-left',
                boundsWidth: 800,
                boundsHeight: 600,
                sampleIntervalMs: 1000 / 120,
                sampleCount: 96,
                insideSampleCount: 84,
                buttonSampleCount: 18,
                scrollCaptured: false,
                truncated: false,
                events: [
                  {timeMs: 100, kind: 'down', x: 0.5, y: 0.4, button: 'left', withinCapture: true},
                  {timeMs: 140, kind: 'up', x: 0.5, y: 0.4, button: 'left', withinCapture: true},
                  {timeMs: 250, kind: 'down', x: 0.1, y: 0.2, button: 'left', withinCapture: true},
                  {timeMs: 350, kind: 'drag', x: 0.5, y: 0.5, button: 'left', withinCapture: true},
                  {timeMs: 450, kind: 'up', x: 0.8, y: 0.8, button: 'left', withinCapture: true},
                  {timeMs: 600, kind: 'down', x: 0.998, y: 0.5, button: 'left', withinCapture: true},
                  {timeMs: 700, kind: 'drag', x: 1, y: 0.5, button: 'left', withinCapture: false},
                  {timeMs: 800, kind: 'up', x: 1, y: 0.5, button: 'left', withinCapture: false},
                ],
              },
            },
          };
          await mkdir(dirname(briefPath), {recursive: true});
          await writeFile(briefPath, JSON.stringify(brief), {mode: 0o600});
          JS
          project="$RUNNER_TEMP/bun-project"
          mkdir -p "$project"
          printf '%s\n' 'preload = ["./project-preload.mjs"]' > "$project/bunfig.toml"
          printf '%s\n' 'console.log("Project preload must not run inside Poach MCP"); process.exit(1);' > "$project/project-preload.mjs"
          for launcher in "Poach Codex/marketplace/plugins/poach/launch-connector.sh" claude/launch-connector.sh; do
            result="$("$resources/runtime/bin/node" --input-type=module - "$launcher" "$RUNNER_TEMP/sample.mp4" "$project" <<'JS'
          import {spawn} from 'node:child_process';
          import {resolve} from 'node:path';
          import {createInterface} from 'node:readline';
          import assert from 'node:assert/strict';
          const server = spawn('/bin/bash', [resolve(process.argv[2])], {cwd:process.argv[4], stdio:['pipe','pipe','inherit']});
          const lines = createInterface({input: server.stdout})[Symbol.asyncIterator]();
          function send(message) { server.stdin.write(JSON.stringify({jsonrpc:'2.0', ...message})+'\n'); }
          async function request(id, method, params) {
            send({id,method,params});
            for (;;) {
              const line = await lines.next();
              assert.ok(!line.done, 'Connector closed unexpectedly');
              const reply = JSON.parse(line.value);
              if (reply.id === id) { assert.ok(!reply.error); return reply.result; }
            }
          }
          try {
            await request(1,'initialize',{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'beta-test',version:'1'}});
            send({method:'notifications/initialized'});
            const listed = await request(2,'tools/list',{});
            const toolNames = listed.tools.map(tool => tool.name);
            for (const name of ['poach_inspect','poach_inspect_image','poach_read_brief','poach_read_moment']) assert.ok(toolNames.includes(name), `Missing ${name}`);

            const inspected = await request(3,'tools/call',{name:'poach_inspect',arguments:{videoPath:process.argv[3]}});
            assert.ok(!inspected.isError, JSON.stringify(inspected.content));
            assert.ok(inspected.structuredContent.keyframes.length);

            const briefId = 'df5ff2b4-663c-41ec-8de2-5c90e837bd82';
            const brief = await request(4,'tools/call',{name:'poach_read_brief',arguments:{briefId,includeKeyframes:true}});
            assert.ok(!brief.isError, JSON.stringify(brief.content));
            assert.equal(brief.structuredContent.briefId, briefId);
            const legacyBeta = /^v0\.1\.0-beta\.[1-4]$/.test(process.env.RELEASE_TAG ?? '');
            assert.equal(brief.content.filter(item => item.type === 'image').length, legacyBeta ? 1 : 3);
            if (!legacyBeta) {
              assert.ok(brief.content.some(item => item.type === 'text' && item.text.startsWith('After drag release: 599 ms')));
            }
            assert.equal(brief.structuredContent.evidence.annotations[0].timeMs, 500);
            assert.equal(brief.structuredContent.evidence.annotations[0].text, 'The card lands in Done.');
            assert.equal(brief.structuredContent.evidence.pointerTrace.sampleCount, 96);
            assert.equal(brief.structuredContent.evidence.pointerTrace.insideSampleCount, 84);
            if (!legacyBeta) {
              const actions = brief.structuredContent.evidence.interactionActions.actions;
              assert.deepEqual(actions.map(action => action.kind), ['click','drag','drag']);
              assert.deepEqual(actions.map(action => action.timeMs), [100,250,600]);
              assert.equal(actions[2].durationMs, 200);
            }

            const moment = await request(5,'tools/call',{name:'poach_read_moment',arguments:{briefId,timeMs:350}});
            assert.ok(!moment.isError, JSON.stringify(moment.content));
            assert.equal(moment.content.filter(item => item.type === 'image').length, 1);
            const momentText = moment.content.find(item => item.type === 'text').text;
            if (!legacyBeta) {
              assert.match(momentText, /The card lands in Done/);
              assert.match(momentText, /"kind":"click"/);
              assert.match(momentText, /"kind":"drag"/);
              assert.match(momentText, /Pointer trace summary: 96 samples, 84 inside the capture, 18 with a button held, 8 recorded pointer events, and 3 summarized clicks or drags\./);
            }
          } finally { server.kill(); }
          console.log(`Verified connector: ${process.argv[2]}`);
          JS
          )"
            if [[ "$result" != "Verified connector: $launcher" ]]; then
              echo "Connector smoke test did not complete: $launcher" >&2
              exit 1
            fi
            printf '%s\n' "$result"
          done
