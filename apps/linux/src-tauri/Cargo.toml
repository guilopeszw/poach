[package]
name = "poach-linux"
version = "0.1.0"
description = "Poach for Linux"
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "screenshot"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
libc = "0.2"
zbus = { version = "6.5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
